<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <title>QP</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
    content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1" />

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />

  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape">

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style-mobile.css" />
  <link rel="icon" href="favicon.ico" />
</head>

<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

  <script src="src/settings.js" charset="utf-8"></script>

  <script src="main.js" charset="utf-8"></script>
  <script>

    //是否是全屏
    function isFullScreen() {
      return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    }

    // 判断当前是否已经是 PWA 独立模式运行（即已经安装到桌面）
    function isStandalone() {
      // 两种方式检测：
      // 1. matchMedia('(display-mode: standalone)') → 兼容大部分浏览器
      // 2. navigator.standalone → 专门兼容 iOS Safari
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    //启动全屏
    function startquan() {
      const elem = document.documentElement;
      // 进入全屏模式
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }


    function autoLock() {
      //   if (!isStandalone()) {
      //     console.log("不是pwa模式")
      //     return;
      //   }
      //启动一个检测计时器
      const interval = setInterval(function () {
        if (!GlobalCfg.CURSCENE_DIRECTION) {
          console.log("GlobalCfg.CURSCENE_DIRECTION 不存在")
          return
        }
        if (GlobalCfg.CURSCENE_DIRECTION == "vertical")  {
          if (screen.orientation.type.indexOf("portrait") == -1) {
            screen.orientation.lock("portrait-primary")
              .then(() => console.log("锁定成功"))
              .catch(err => console.error("锁定失败:", err));
          }
        }
        if (GlobalCfg.CURSCENE_DIRECTION == "horizontal") {
          if (screen.orientation.type.indexOf("landscape") == -1) {
            screen.orientation.lock("landscape-primary")
              .then(() => console.log("锁定成功"))
              .catch(err => console.error("锁定失败:", err));
          }

        }
      }, 100)

      const interval1 = setInterval(function () {
        if (!isFullScreen()) {
          console.log("当前不是全屏");
          startquan();
        } else {
          console.log("当前是全屏");
        }
      }, 1000)
    }
    autoLock();
  </script>
  <script type="text/javascript">
    (function () {
      // open web debugger console
      if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
      }

      var debug = window._CCSettings.debug;
      var splash = document.getElementById('splash');
      splash.style.display = 'block';

      function loadScript(moduleName, cb) {
        function scriptLoaded() {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
        };
        var domScript = document.createElement('script');
        domScript.async = true;
        domScript.src = moduleName;
        domScript.addEventListener('load', scriptLoaded, false);
        document.body.appendChild(domScript);
      }

      loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {
        if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
          loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
        }
        else {
          window.boot();
        }
      });
    })();
  </script>
</body>

</html>
